# DeepSoCal — http-level settings. Installed as /etc/nginx/conf.d/deepsocal.conf
# (nginx.conf includes conf.d/*.conf inside the http block).

# Don't reveal the nginx version in headers or error pages.
server_tokens off;

# Contact + scoping forms (/api/): 5 requests/minute per client IP, burst 5.
# See the /api/ location in sites-available/deepsocal. Rejections get 429,
# which the forms show as "Too many messages…".
limit_req_zone $binary_remote_addr zone=deepsocal_api:10m rate=5r/m;
limit_req_status 429;

# Browser cache for public/ images + video (not content-hashed): a week for
# successful responses only, so a 404 or a 502 during a deploy isn't cached.
map $status $deepsocal_asset_cache {
    200     "public, max-age=604800";
    206     "public, max-age=604800";
    304     "public, max-age=604800";
    default "no-store";
}
