# Security headers for every deepsocal.com response (incl. /studio).
# nginx drops inherited add_header directives in any block that sets its own,
# so locations with their own add_header must include this file again.
add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
